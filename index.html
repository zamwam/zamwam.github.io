<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zamwam</title>
<style>
:root{--bg:#070b14;--panel:#111827cc;--txt:#eef2ff;--muted:#94a3b8;--acc:#5b8cff}
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:radial-gradient(circle at top,#1b2b55,transparent 35%),#070b14;color:var(--txt)}
nav{position:sticky;top:0;display:flex;justify-content:space-between;padding:16px 32px;background:#0b1020bb;backdrop-filter:blur(10px)}
.wrap{max-width:1200px;margin:auto;padding:24px}
.hero{padding:60px 0;text-align:center}.hero h1{font-size:56px;margin:0}.hero p{color:var(--muted)}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
input,select{padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid #23314d;border-radius:18px;padding:18px;transition:.2s}
.card:hover{transform:translateY(-4px)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px}
a.btn{display:inline-block;margin-top:14px;padding:10px 14px;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px}
.stats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.stat{background:var(--panel);padding:14px 20px;border-radius:14px}
</style>
</head>
<body>
<nav><strong>Zamwam</strong><a style="color:white;text-decoration:none" href="https://github.com/zamwam">GitHub</a></nav>
<div class="wrap">
<section class="hero">
<h1>Zamwam</h1>
<p>Software, tools and open source projects.</p>
<div class="stats">
<div class="stat"><div id="repos">-</div><small>Repositories</small></div>
<div class="stat"><div id="stars">-</div><small>Stars</small></div>
<div class="stat"><div id="langs">-</div><small>Languages</small></div>
</div>
</section>
<div class="controls">
<input id="search" placeholder="Search projects..." style="flex:1">
<select id="sort"><option value="updated">Recently Updated</option><option value="stars">Stars</option><option value="name">Name</option></select>
</div>
<div id="grid" class="grid"></div>
</div>
<script>
const user="zamwam",cacheKey="gh_cache_v1",ttl=1800000;
async function load(){
 let data=JSON.parse(localStorage.getItem(cacheKey)||"null");
 if(!data||Date.now()-data.time>ttl){
   const r=await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`);
   data={time:Date.now(),repos:await r.json()};
   localStorage.setItem(cacheKey,JSON.stringify(data));
 }
 let repos=data.repos.filter(r=>!r.fork);
 const grid=document.getElementById("grid");
 function render(){
  let arr=[...repos];
  const q=search.value.toLowerCase();
  arr=arr.filter(r=>r.name.toLowerCase().includes(q)||(r.description||"").toLowerCase().includes(q));
  if(sort.value=="stars")arr.sort((a,b)=>b.stargazers_count-a.stargazers_count);
  if(sort.value=="name")arr.sort((a,b)=>a.name.localeCompare(b.name));
  grid.innerHTML="";
  arr.forEach(r=>{
    const gh=r.html_url,pages=`https://${user}.github.io/${r.name}/`;
    grid.insertAdjacentHTML("beforeend",`<div class="card">
    <div class="badge">${r.language||"Other"}</div>
    <h3>${r.name}</h3>
    <p>${r.description||"No description."}</p>
    <small>⭐ ${r.stargazers_count} • Updated ${new Date(r.updated_at).toLocaleDateString()}</small><br>
    <a class="btn" target="_blank" href="${pages}">Launch</a>
    <a class="btn" target="_blank" href="${gh}" style="background:#334155">Repository</a>
    </div>`);
  });
  reposCount.textContent=repos.length;
  stars.textContent=repos.reduce((a,b)=>a+b.stargazers_count,0);
  langs.textContent=[...new Set(repos.map(r=>r.language).filter(Boolean))].length;
 }
 search.oninput=render;sort.onchange=render;
 window.reposCount=document.getElementById("repos");
 render();
}
load();
</script>
</body></html>
